<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Neuron Lab</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><strong>LOCAL / NEURON LAB</strong><span id="status">Loading…</span></header>
<main><aside><button id="new">＋ New conversation</button><nav id="chats"></nav></aside>
<section class="chat"><div class="heading"><h1>Qwen3.5 · 4B</h1><span id="active"></span></div><div id="messages" aria-live="polite"></div>
<form id="compose"><textarea id="prompt" placeholder="Message your local model…" required aria-label="Message"></textarea><div class="settings"><label>Temperature <input id="temperature" type="number" value="0.7" min="0" max="2" step=".1"></label><label>Max tokens <input id="tokens" type="number" value="256" min="1" max="2048"></label><label>Top p <input id="topP" type="number" value=".9" min=".01" max="1" step=".05"></label></div><div class="settings"><label>Conversation profile <select id="override"><option value="">Global default</option></select></label><button id="send">Send ↗</button><button id="compare" type="button">Compare baseline / steered</button></div></form><div id="error" role="alert"></div></section>
<aside class="steering"><h2>Neuron steering</h2><label><input type="checkbox" id="global"> Global steering enabled</label><p>Changes apply to subsequent web and VS Code requests.</p><select id="profiles" aria-label="Active profile"></select><div class="actions"><button id="create">New</button><button id="rename">Rename</button><button id="duplicate">Duplicate</button><button id="delete">Delete</button></div><label><input type="checkbox" id="enabled"> Enable this profile</label><div id="codes"></div><textarea id="codeInput" aria-label="Neuron codes" placeholder="L15 00150 +1&#10;L15 00420 -1"></textarea><button id="add">Add codes</button><p id="sync">Profiles saved on server</p><details><summary>Calibration & effective shifts</summary><pre id="inspection"></pre></details></aside></main><script src="/static/app.js"></script></body></html>
